<!-- MODAL CHECKOUT -->
<div id="modalCheckout" class="modal-checkout">
    <div class="form-container">
        <h2 id="titulo-checkout">Finalizar Pedido</h2>

        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nome_cliente" placeholder="Digite seu nome completo">
        </div>

        <div class="form-group">
            <label>CPF</label>
            <input type="text" id="cpf_cliente" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
        </div>

        <div class="form-group">
            <label>CEP</label>
            <input type="text" id="cep_cliente" placeholder="00000-000">
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label>Rua</label>
                <input type="text" id="rua_cliente">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Nº</label>
                <input type="text" id="num_cliente">
            </div>
        </div>

        <div class="form-group">
            <label>Nº do Cartão (apenas registro)</label>
            <input type="text" id="num_cartao">
        </div>

        <div class="form-group">
            <label>Parcelas</label>
            <select id="parcelas_pag">
                <option value="1x">1x (À vista)</option>
                <option value="2x">2x</option>
                <option value="3x">3x</option>
                <option value="4x">4x</option>
                <option value="5x">5x</option>
                <option value="6x">6x</option>
                <option value="7x">7x</option>
                <option value="8x">8x</option>
                <option value="9x">9x</option>
                <option value="10x">10x</option>
                <option value="11x">11x</option>
                <option value="12x">12x</option>
            </select>
        </div>

        <button class="btn-comprar" onclick="processarPedido()" style="border:none; width:100%;">
            Confirmar e Ir para Pagamento
        </button>

        <button onclick="document.getElementById('modalCheckout').style.display='none'" style="background:none; border:none; color:red; width:100%; margin-top:10px;">
            Cancelar
        </button>
    </div>
</div>

function processarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    const cpf = document.getElementById('cpf_cliente').value;
    const cep = document.getElementById('cep_cliente').value;
    const rua = document.getElementById('rua_cliente').value;
    const numero = document.getElementById('num_cliente').value;
    const cartao = document.getElementById('num_cartao').value;
    const parcela = document.getElementById('parcelas_pag').value;

    if (!nome || !cpf || !cep || !rua || !numero || !cartao) {
        alert("Preencha todos os campos obrigatórios!");
        return;
    }

    const produto = pagamentos[produtoSelecionado];

    if (!produto) {
        alert("Produto não encontrado.");
        return;
    }

    const link = produto.links[parcela];

    if (!link) {
        alert("Essa forma de pagamento não está disponível para esse produto.");
        return;
    }

    alert(`Perfeito, ${nome}! Redirecionando para pagamento em ${parcela}...`);
    window.location.href = link;
}
