<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BS Smart Tech - Smartphones e Acessórios</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #27ae60;
            --whatsapp-color: #25D366;
            --background-body: #e3f2fd;
            --text-main: #333;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background-color: var(--background-body); 
            color: var(--text-main); 
            scroll-behavior: smooth;
        }

        /* HEADER */
        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 1rem; 
            display: flex; flex-direction: column; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        header h1 { margin: 0 0 10px 0; font-size: 1.4rem; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 15px; }
        nav a { text-decoration: none; color: #ccc; font-size: 0.95rem; }

        /* VITRINE */
        .section-title { text-align: center; margin: 35px 0 15px; font-size: 1.6rem; }
        .vitrine { display: grid; grid-template-columns: 1fr; padding: 15px; gap: 20px; max-width: 1200px; margin: 0 auto; }

        /* CARD PRODUTO */
        .produto-card {
            background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 15px; text-align: center; display: flex; flex-direction: column; border: 1px solid #eee;
        }

        .carrossel-slide {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none; margin-bottom: 5px;
        }
        .carrossel-slide::-webkit-scrollbar { display: none; }
        .carrossel-slide img { flex: 0 0 100%; scroll-snap-align: center; height: 220px; object-fit: contain; cursor: pointer; }

        .hint-fotos { font-size: 0.75rem; color: #27ae60; margin-bottom: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .preco { color: var(--accent-color); font-size: 1.5rem; font-weight: bold; margin: 5px 0; }
        
        .btn-comprar {
            display: block; background-color: var(--whatsapp-color); color: white;
            padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: auto;
        }

        /* ------------------------------------------------------
           ESTILO DO MODAL E DAS BOLINHAS (INDICADORES)
           ------------------------------------------------------ */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; 
            width: 100%; height: 100%; background-color: #ffffff; /* Fundo Branco solicitado */
            align-items: center; justify-content: center;
        }

        .modal-content-container { position: relative; width: 100%; max-width: 500px; text-align: center; }
        .modal-content { width: 90%; max-height: 70vh; object-fit: contain; }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.05); color: #000; border: none;
            padding: 20px 15px; cursor: pointer; border-radius: 5px; font-size: 20px;
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        .fechar { position: absolute; top: -50px; right: 15px; color: #000; font-size: 40px; cursor: pointer; }

        /* CONTAINER DAS BOLINHAS */
        .dots-container {
            display: flex; justify-content: center; gap: 8px; margin-top: 15px;
        }

        /* ESTILO DA BOLINHA INDIVIDUAL */
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: #ddd; /* Cor da bolinha inativa */
            transition: 0.3s;
        }

        /* ALTERAÇÃO: Cor da bolinha ativa (Preta) */
        .dot.active {
            background-color: #000; 
            transform: scale(1.2);
        }

        @media (min-width: 600px) {
            .vitrine { grid-template-columns: repeat(2, 1fr); }
            .prev { left: -50px; } .next { right: -50px; }
            .fechar { top: -20px; right: -50px; }
        }
    </style>
</head>
<body>

<header>
    <h1>BS SMART TECH</h1> 
</header>

<div class="vitrine">
    <!-- PRODUTO EXEMPLO -->
    <div class="produto-card">
        <div class="carrossel-slide"> 
            <img src="iphone-17pro.jpeg" onclick="abrirGaleria(['iphone-17pro.jpeg', 'iphone-17pro1.jpeg', 'iphone-17pro2.jpeg'], 0)">
        </div>
        <span class="hint-fotos"><span class="material-icons">swipe</span> CLIQUE PARA AMPLIAR</span>
        <h3>iPhone 17 Pro 256GB</h3>
        <div class="preco">R$ 7.899,00</div>
        <a href="#" class="btn-comprar">Comprar Agora</a>
    </div>
</div>

<!-- MODAL DE GALERIA AMPLIADA -->
<div id="modalGaleria" class="modal">
    <div class="modal-content-container">
        <span class="fechar" onclick="fecharGaleria()">&times;</span>
        <button class="nav-btn prev" onclick="mudarFoto(-1)">&#10094;</button>
        <img class="modal-content" id="imgSlide">
        <button class="nav-btn next" onclick="mudarFoto(1)">&#10095;</button>
        
        <!-- ELEMENTO ONDE AS BOLINHAS SERÃO CRIADAS VIA JS -->
        <div id="dotsContainer" class="dots-container"></div>
    </div>
</div>

<script>
    let fotosAtuais = [];
    let indiceAtual = 0;

    function abrirGaleria(listaFotos, indexClicado) {
        fotosAtuais = listaFotos;
        indiceAtual = indexClicado;
        document.getElementById("modalGaleria").style.display = "flex";
        document.body.style.overflow = "hidden";
        
        criarBolinhas(); // Cria as bolinhas quando abre o modal
        atualizarSlide();
    }

    function fecharGaleria() {
        document.getElementById("modalGaleria").style.display = "none";
        document.body.style.overflow = "auto";
    }

    // Função para criar as bolinhas dinamicamente baseada na quantidade de fotos
    function criarBolinhas() {
        const container = document.getElementById("dotsContainer");
        container.innerHTML = ""; // Limpa bolinhas anteriores
        
        fotosAtuais.forEach((_, i) => {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            // Se clicar na bolinha, também muda a foto
            dot.onclick = () => { indiceAtual = i; atualizarSlide(); };
            container.appendChild(dot);
        });
    }

    function mudarFoto(direcao) {
        indiceAtual += direcao;
        if (indiceAtual >= fotosAtuais.length) indiceAtual = 0;
        if (indiceAtual < 0) indiceAtual = fotosAtuais.length - 1;
        atualizarSlide();
    }

    function atualizarSlide() {
        const img = document.getElementById("imgSlide");
        img.src = fotosAtuais[indiceAtual];
        
        // Lógica para destacar a bolinha ativa
        const dots = document.querySelectorAll(".dot");
        dots.forEach((dot, i) => {
            if (i === indiceAtual) {
                dot.classList.add("active");
            } else {
                dot.classList.remove("active");
            }
        });

        const botoes = document.querySelectorAll(".nav-btn");
        botoes.forEach(btn => btn.style.display = fotosAtuais.length > 1 ? "block" : "none");
    }

    window.onclick = function(e) {
        if (e.target == document.getElementById("modalGaleria")) fecharGaleria();
    }
</script>

</body>
</html>
