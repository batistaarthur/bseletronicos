<!-- ADICIONE ESTE CSS DENTRO DA TAG <style> -->
<style>
    /* ... seu código anterior ... */
    
    .btn-checkout {
        display: block;
        background-color: #2980b9; /* Azul */
        color: white;
        padding: 12px;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        margin: 10px 0;
        cursor: pointer;
        border: none;
        width: 100%;
        font-size: 0.9rem;
    }

    /* Estilo do Formulário (Modal) */
    .checkout-modal {
        display: none;
        position: fixed;
        z-index: 3000;
        left: 0; top: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        overflow-y: auto;
    }
    .checkout-content {
        background: white;
        margin: 5% auto;
        padding: 20px;
        width: 90%;
        max-width: 500px;
        border-radius: 15px;
    }
    .checkout-content h2 { margin-top: 0; color: #1a1a1a; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group select {
        width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;
    }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>

<!-- ADICIONE O BOTÃO ABAIXO DAS FOTOS EM CADA PRODUTO (produto-card) -->
<!-- Exemplo no iPhone 17 Pro: -->
<button class="btn-checkout" onclick="abrirCheckout('iPhone 17 Pro 256GB', 'R$ 7.899,00')">Preencher Dados de Compra</button>


<!-- ADICIONE ESTE HTML ANTES DO </body> -->
<div id="modalCheckout" class="checkout-modal">
    <div class="checkout-content">
        <h2>Dados do Pedido</h2>
        <p id="prod-selecionado" style="font-weight: bold; color: var(--accent-color);"></p>
        
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Seu nome">
        </div>
        
        <div class="form-group">
            <label>CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>

        <div class="form-group">
            <label>Endereço de Entrega</label>
            <input type="text" id="endereco" placeholder="Rua, Número, Bairro">
        </div>

        <div class="grid-form">
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="cidade" placeholder="Ex: Linhares">
            </div>
            <div class="form-group">
                <label>Estado</label>
                <input type="text" id="estado" placeholder="ES">
            </div>
        </div>

        <hr>
        <h3>Pagamento</h3>
        
        <div class="form-group">
            <label>Número do Cartão</label>
            <input type="text" id="cartao" placeholder="0000 0000 0000 0000">
        </div>

        <div class="grid-form">
            <div class="form-group">
                <label>Validade</label>
                <input type="text" id="validade" placeholder="MM/AA">
            </div>
            <div class="form-group">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="123">
            </div>
        </div>

        <div class="form-group">
            <label>Parcelamento</label>
            <select id="parcelas">
                <option value="1x">À vista</option>
                <option value="2x">2x sem juros</option>
                <option value="3x">3x sem juros</option>
                <option value="6x">6x com acréscimo</option>
                <option value="12x">12x com acréscimo</option>
            </select>
        </div>

        <button class="btn-comprar" style="width: 100%; border: none;" onclick="enviarCheckout()">Finalizar e Enviar via WhatsApp</button>
        <button onclick="fecharCheckout()" style="background:none; border:none; color:red; width:100%; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<!-- ADICIONE ESTE SCRIPT NO FINAL DA TAG <script> -->
<script>
    let produtoAtual = "";
    let precoAtual = "";

    function abrirCheckout(nome, preco) {
        produtoAtual = nome;
        precoAtual = preco;
        document.getElementById("prod-selecionado").innerText = "Produto: " + nome + " - " + preco;
        document.getElementById("modalCheckout").style.display = "block";
        document.body.style.overflow = "hidden";
    }

    function fecharCheckout() {
        document.getElementById("modalCheckout").style.display = "none";
        document.body.style.overflow = "auto";
    }

    function enviarCheckout() {
        // Coleta os dados
        const nome = document.getElementById("nome").value;
        const cpf = document.getElementById("cpf").value;
        const endereco = document.getElementById("endereco").value;
        const cidade = document.getElementById("cidade").value;
        const cartao = document.getElementById("cartao").value;
        const parcelas = document.getElementById("parcelas").value;

        if(!nome || !cpf || !endereco) {
            alert("Por favor, preencha os dados básicos!");
            return;
        }

        // Monta a mensagem para o WhatsApp
        const mensagem = `*NOVO PEDIDO - BS SMART TECH*%0A%0A` +
            `*Produto:* ${produtoAtual}%0A` +
            `*Preço:* ${precoAtual}%0A` +
            `--------------------------%0A` +
            `*Cliente:* ${nome}%0A` +
            `*CPF:* ${cpf}%0A` +
            `*Endereço:* ${endereco}, ${cidade}%0A` +
            `--------------------------%0A` +
            `*PAGAMENTO*%0A` +
            `*Cartão:* ${cartao}%0A` +
            `*Parcelas:* ${parcelas}`;

        // Envia para o seu número
        window.open(`https://wa.me/5527992985369?text=${mensagem}`, '_blank');
        fecharCheckout();
    }
</script>
