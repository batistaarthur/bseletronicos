<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BS Smart Tech - Smartphones e Acessórios</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #27ae60;
            --whatsapp-color: #25D366;
            --background-body: #f4f7f6;
            --text-main: #333;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; background-color: var(--background-body); color: var(--text-main); scroll-behavior: smooth; }

        header { background-color: var(--primary-color); color: white; padding: 1rem; display: flex; flex-direction: column; align-items: center; position: sticky; top: 0; z-index: 1000; }
        header h1 { margin: 0 0 10px 0; font-size: 1.3rem; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 15px; }
        nav a { text-decoration: none; color: #ccc; font-size: 0.9rem; }

        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=1400&q=80'); height: 180px; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .vitrine { display: grid; grid-template-columns: 1fr; padding: 15px; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .produto-card { background: white; border-radius: 15px; padding: 15px; text-align: center; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .btn-comprar { display: block; background-color: var(--whatsapp-color); color: white; padding: 15px; text-decoration: none; border-radius: 10px; font-weight: bold; margin-top: 10px; }
        .btn-dados { display: block; background-color: #007bff; color: white; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; border: none; width: 100%; cursor: pointer; }

        .modal-checkout { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); overflow-y: auto; }
        .form-container { background: white; padding: 20px; border-radius: 15px; width: 95%; max-width: 500px; margin: 30px auto; }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }

        #area-pix { display: none; text-align: center; padding: 15px; border: 2px dashed var(--accent-color); background: #f0fff4; border-radius: 10px; }
        #qrcode-container img { margin: 0 auto; }
    </style>
</head>
<body>

<header>
    <h1>BS SMART TECH</h1> 
    <nav>
        <ul>
            <li><a href="#home">Início</a></li>
            <li><a href="#smartphones">Smartphones</a></li>
            <li><a href="#acessorios">Acessórios</a></li>
        </ul>
    </nav>
</header>

<div class="vitrine" id="smartphones">
    <!-- Produto 1 -->
    <div class="produto-card">
        <h3>iPhone 17 Pro 256GB</h3>
        <div class="preco">R$ 7.899,00</div>
        <button class="btn-dados" onclick="abrirCheckout('iPhone 17 Pro 256GB')">Comprar com Cartão / PIX</button>
    </div>

    <!-- Produto 2 -->
    <div class="produto-card">
        <h3>iPhone 17 256GB</h3>
        <div class="preco">R$ 6.399,00</div>
        <button class="btn-dados" onclick="abrirCheckout('iPhone 17 256GB')">Comprar com Cartão / PIX</button>
    </div>
</div>

<!-- MODAL DE CHECKOUT -->
<div id="modalCheckout" class="modal-checkout">
    <div class="form-container">
        <h2 id="titulo-checkout">Finalizar Pedido</h2>
        
        <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nome_cliente" placeholder="Seu nome">
        </div>

        <div class="form-group">
            <label>Método de Pagamento</label>
            <select id="metodo_pagamento" onchange="alternarPagamento()">
                <option value="cartao">Cartão de Crédito</option>
                <option value="pix">PIX (Com Desconto)</option>
            </select>
        </div>

        <div id="area-cartao">
            <div class="form-group">
                <label>Selecione o Parcelamento</label>
                <select id="parcelas_pag">
                    <option value="1">1x à vista</option>
                    <option value="2">2x sem juros</option>
                    <option value="3">3x sem juros</option>
                    <option value="4">4x</option>
                    <option value="5">5x</option>
                    <option value="6">6x</option>
                    <option value="7">7x</option>
                    <option value="8">8x</option>
                    <option value="9">9x</option>
                    <option value="10">10x</option>
                    <option value="11">11x</option>
                    <option value="12">12x</option>
                </select>
            </div>
        </div>

        <div id="area-pix">
            <div id="qrcode-container"></div>
            <input type="text" id="pix-copia-cola" readonly style="width:100%; margin-top:10px; font-size:10px;">
            <button class="btn-dados" style="background:#666" onclick="copiarPix()">Copiar Código PIX</button>
        </div>

        <button id="btn-finalizar" class="btn-comprar" style="width:100%; border:none; cursor:pointer;" onclick="processarPedido()">
            Confirmar Pagamento
        </button>
        
        <button onclick="fecharCheckout()" style="background:none; border:none; color:red; width:100%; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<script>
    let produtoSelecionado = "";
    
    // CADASTRE SEUS LINKS AQUI
    const linksPagamento = {
        "iPhone 17 Pro 256GB": {
            "1": "https://link-da-parcela-1.com",
            "2": "https://link-da-parcela-2.com",
            "3": "https://link-da-parcela-3.com",
            "4": "https://link...", // e assim por diante até o 12
            "12": "https://link-da-parcela-12.com"
        },
        "iPhone 17 256GB": {
            "1": "https://link-iphone17-1x.com",
            "12": "https://link-iphone17-12x.com"
        }
    };

    const precosLoja = {
        "iPhone 17 Pro 256GB": "7899.00",
        "iPhone 17 256GB": "6399.00"
    };

    function abrirCheckout(produto) {
        produtoSelecionado = produto;
        document.getElementById('titulo-checkout').innerText = produto;
        document.getElementById('modalCheckout').style.display = 'block';
        alternarPagamento();
    }

    function fecharCheckout() {
        document.getElementById('modalCheckout').style.display = 'none';
    }

    function alternarPagamento() {
        const metodo = document.getElementById('metodo_pagamento').value;
        document.getElementById('area-cartao').style.display = (metodo === 'cartao') ? 'block' : 'none';
        document.getElementById('area-pix').style.display = (metodo === 'pix') ? 'block' : 'none';
        
        if(metodo === 'pix') gerarCodigoPix();
    }

    function gerarCodigoPix() {
        const valor = precosLoja[produtoSelecionado];
        const chavePix = "8ec0e358-4d5e-40c8-9660-afbe089c76f6"; 
        const nome = "ARTHUR BATISTA DA SILVA";
        const cidade = "LINHARES";

        // Correção da String do Payload (Template Strings)
        const payload = `00020101021126580014br.gov.bcb.pix0114${chavePix}520400005303986540${valor}5802BR5913${nome}6008${cidade}62070503***6304`;
        
        const container = document.getElementById("qrcode-container");
        container.innerHTML = "";
        new QRCode(container, { text: payload, width: 150, height: 150 });
        document.getElementById('pix-copia-cola').value = payload;
    }

    function copiarPix() {
        const input = document.getElementById('pix-copia-cola');
        input.select();
        document.execCommand('copy');
        alert("Código copiado!");
    }

    function processarPedido() {
        const nome = document.getElementById('nome_cliente').value;
        const metodo = document.getElementById('metodo_pagamento').value;

        if(!nome) return alert("Por favor, digite seu nome.");

        if (metodo === 'pix') {
            window.location.href = `https://wa.me/5527992985369?text=Oi! Paguei o PIX do ${produtoSelecionado}. Nome: ${nome}`;
        } else {
            const parcela = document.getElementById('parcelas_pag').value;
            const link = linksPagamento[produtoSelecionado][parcela];
            
            if(link && link !== "https://link...") {
                window.location.href = link;
            } else {
                alert("Link de pagamento para " + parcela + "x ainda não configurado.");
            }
        }
    }
</script>

</body>
</html>
