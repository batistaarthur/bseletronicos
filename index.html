<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Smart Tech</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
.produto-card{background:#fff;padding:20px;margin:20px;border-radius:10px;text-align:center}
.btn-dados{background:#007bff;color:#fff;padding:10px;border:none;border-radius:8px;width:100%;cursor:pointer}
.modal-checkout{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8)}
.form-container{background:#fff;padding:20px;border-radius:10px;margin:50px auto;max-width:400px}
</style>
</head>

<body>

<div class="produto-card">
<h3>iPhone 17 Pro 256GB</h3>
<button class="btn-dados" onclick="abrirCheckout('iPhone 17 Pro 256GB')">Comprar</button>
</div>

<div class="produto-card">
<h3>iPhone 17 256GB</h3>
<button class="btn-dados" onclick="abrirCheckout('iPhone 17 256GB')">Comprar</button>
</div>

<div class="produto-card">
<h3>iPhone 16 256GB</h3>
<button class="btn-dados" onclick="abrirCheckout('iPhone 16 256GB')">Comprar</button>
</div>

<div class="produto-card">
<h3>Galaxy S25 Ultra 5G</h3>
<button class="btn-dados" onclick="abrirCheckout('Galaxy S25 Ultra 5G')">Comprar</button>
</div>

<!-- MODAL -->
<div id="modalCheckout" class="modal-checkout">
<div class="form-container">

<h2 id="titulo-checkout"></h2>

<input id="nome_cliente" placeholder="Nome completo"><br><br>
<input id="cpf_cliente" placeholder="CPF"><br><br>
<input id="cep_cliente" placeholder="CEP"><br><br>
<input id="rua_cliente" placeholder="Rua"><br><br>
<input id="num_cliente" placeholder="Número"><br><br>

<select id="parcelas_pag">
<option value="1x">1x</option>
<option value="2x">2x</option>
<option value="3x">3x</option>
<option value="4x">4x</option>
<option value="5x">5x</option>
<option value="6x">6x</option>
<option value="7x">7x</option>
<option value="8x">8x</option>
<option value="9x">9x</option>
<option value="10x">10x</option>
<option value="11x">11x</option>
<option value="12x">12x</option>
</select><br><br>

<button onclick="processarPedido()">Pagar</button>
<button onclick="fechar()">Cancelar</button>

</div>
</div>

<script>

let produtoSelecionado = "";

// ================= PAGAMENTOS =================
const pagamentos = {

"iPhone 17 Pro 256GB": {
"1x":"LINK_PRO_1X","2x":"LINK_PRO_2X","3x":"LINK_PRO_3X",
"4x":"LINK_PRO_4X","5x":"LINK_PRO_5X","6x":"LINK_PRO_6X",
"7x":"LINK_PRO_7X","8x":"LINK_PRO_8X","9x":"LINK_PRO_9X",
"10x":"LINK_PRO_10X","11x":"LINK_PRO_11X","12x":"LINK_PRO_12X"
},

"iPhone 17 256GB": {
"1x":"LINK_17_1X","2x":"LINK_17_2X","3x":"LINK_17_3X",
"4x":"LINK_17_4X","5x":"LINK_17_5X","6x":"LINK_17_6X",
"7x":"LINK_17_7X","8x":"LINK_17_8X","9x":"LINK_17_9X",
"10x":"LINK_17_10X","11x":"LINK_17_11X","12x":"LINK_17_12X"
},

"iPhone 16 256GB": {
"1x":"LINK_16_1X","2x":"LINK_16_2X","3x":"LINK_16_3X",
"4x":"LINK_16_4X","5x":"LINK_16_5X","6x":"LINK_16_6X",
"7x":"LINK_16_7X","8x":"LINK_16_8X","9x":"LINK_16_9X",
"10x":"LINK_16_10X","11x":"LINK_16_11X","12x":"LINK_16_12X"
},

"Galaxy S25 Ultra 5G": {
"1x":"LINK_S25_1X","2x":"LINK_S25_2X","3x":"LINK_S25_3X",
"4x":"LINK_S25_4X","5x":"LINK_S25_5X","6x":"LINK_S25_6X",
"7x":"LINK_S25_7X","8x":"LINK_S25_8X","9x":"LINK_S25_9X",
"10x":"LINK_S25_10X","11x":"LINK_S25_11X","12x":"LINK_S25_12X"
}

};

// ================= FUNÇÕES =================
function abrirCheckout(produto){
produtoSelecionado = produto;
document.getElementById("modalCheckout").style.display="block";
document.getElementById("titulo-checkout").innerText="Pedido: "+produto;
}

function fechar(){
document.getElementById("modalCheckout").style.display="none";
}

function processarPedido(){

let nome = document.getElementById("nome_cliente").value;
let cpf = document.getElementById("cpf_cliente").value;
let cep = document.getElementById("cep_cliente").value;
let rua = document.getElementById("rua_cliente").value;
let num = document.getElementById("num_cliente").value;
let parcela = document.getElementById("parcelas_pag").value;

if(!nome || !cpf || !cep || !rua || !num){
alert("Preencha todos os campos!");
return;
}

let link = pagamentos[produtoSelecionado][parcela];

if(!link){
alert("Forma de pagamento não disponível");
return;
}

alert("Redirecionando para pagamento...");
window.location.href = link;

}

</script>

</body>
</html>
