<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BS Smart Tech - Smartphones e Acessórios</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #27ae60;
            --whatsapp-color: #25D366;
            --background-body: #e3f2fd;
            --text-main: #333;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background-color: var(--background-body); 
            color: var(--text-main); 
            scroll-behavior: smooth;
        }

        header { 
            background-color: var(--primary-color); 
            color: white; padding: 1rem; 
            display: flex; flex-direction: column; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 15px; }
        nav a { text-decoration: none; color: #ccc; font-weight: 500; }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=1400&q=80');
            background-size: cover; background-position: center;
            height: 220px; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        .vantagens {
            background-color: white; padding: 15px; display: flex; gap: 20px;
            overflow-x: auto; white-space: nowrap;
        }

        .section-title { text-align: center; margin: 35px 0 15px; font-size: 1.6rem; }
        .vitrine { display: grid; grid-template-columns: 1fr; padding: 15px; gap: 20px; max-width: 1200px; margin: 0 auto; }

        /* CARD E CARROSSEL */
        .produto-card {
            background: white; border-radius: 15px; padding: 15px; 
            text-align: center; display: flex; flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .carrossel-container { position: relative; width: 100%; }

        .carrossel-slide {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 5px;
        }
        .carrossel-slide::-webkit-scrollbar { display: none; }
        
        .carrossel-slide img {
            flex: 0 0 100%;
            scroll-snap-align: center;
            height: 220px; 
            object-fit: contain;
        }

        /* PONTINHOS INDICADORES */
        .indicadores { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
        .dot { width: 8px; height: 8px; background: #ddd; border-radius: 50%; transition: 0.3s; }
        .dot.active { background: var(--accent-color); width: 16px; border-radius: 4px; }

        .hint-fotos { font-size: 0.75rem; color: #27ae60; margin-bottom: 12px; font-weight: bold; }
        .preco { color: var(--accent-color); font-size: 1.5rem; font-weight: bold; }
        .btn-comprar {
            background-color: var(--whatsapp-color); color: white;
            padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold;
        }

        /* MODAL COM FUNDO BRANCO */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: #ffffff; /* ALTERE AQUI PARA MUDAR A COR DO FUNDO */
            align-items: center; justify-content: center;
        }
        .modal-content-container { position: relative; width: 100%; text-align: center; }
        .modal-content { width: 90%; max-height: 75vh; object-fit: contain; }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.1); color: #000; border: none;
            padding: 15px; cursor: pointer; font-size: 24px; border-radius: 50%;
        }
        .prev { left: 10px; } .next { right: 10px; }
        
        .fechar { position: absolute; top: -60px; right: 20px; color: #000; font-size: 40px; cursor: pointer; }
        .contador { color: #333; margin-top: 10px; font-weight: bold; }

        @media (min-width: 600px) { .vitrine { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1000px) { .vitrine { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

<header>
    <h1>BS SMART TECH</h1> 
    <nav>
        <ul>
            <li><a href="#home">Início</a></li>
            <li><a href="#smartphones">Celulares</a></li>
        </ul>
    </nav>
</header>

<h2 class="section-title" id="smartphones">Smartphones em Destaque</h2>
<div class="vitrine">
    
    <!-- PRODUTO 1 -->
    <div class="produto-card">
        <div class="carrossel-container">
            <div class="carrossel-slide" onscroll="atualizarDots(this)"> 
                <!-- Colocamos as fotos principais aqui para o swipe funcionar -->
                <img src="iphone-17pro.jpeg" onclick="abrirGaleria(['iphone-17pro.jpeg', 'iphone-17pro1.jpeg', 'iphone-17pro2.jpeg'], 0)">
                <img src="iphone-17pro1.jpeg" onclick="abrirGaleria(['iphone-17pro.jpeg', 'iphone-17pro1.jpeg', 'iphone-17pro2.jpeg'], 1)">
                <img src="iphone-17pro2.jpeg" onclick="abrirGaleria(['iphone-17pro.jpeg', 'iphone-17pro1.jpeg', 'iphone-17pro2.jpeg'], 2)">
            </div>
            <div class="indicadores">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <span class="hint-fotos"><span class="material-icons" style="vertical-align: middle; font-size: 16px;">swipe</span> ARRASTE PARA O LADO</span>
        <h3>iPhone 17 Pro 256GB</h3>
        <div class="preco">R$ 7.899,00</div>
        <a href="https://wa.me/5527992985369" class="btn-comprar">Comprar Agora</a>
    </div>

    <!-- PRODUTO 2 -->
    <div class="produto-card">
        <div class="carrossel-container">
            <div class="carrossel-slide" onscroll="atualizarDots(this)"> 
                <img src="iphone 17.avif" onclick="abrirGaleria(['iphone 17.avif', 'iphone 17-1.avif', 'iphone 17-2.avif'], 0)">
                <img src="iphone 17-1.avif" onclick="abrirGaleria(['iphone 17.avif', 'iphone 17-1.avif', 'iphone 17-2.avif'], 1)">
                <img src="iphone 17-2.avif" onclick="abrirGaleria(['iphone 17.avif', 'iphone 17-1.avif', 'iphone 17-2.avif'], 2)">
            </div>
            <div class="indicadores">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <span class="hint-fotos"><span class="material-icons" style="vertical-align: middle; font-size: 16px;">swipe</span> ARRASTE PARA O LADO</span>
        <h3>iPhone 17 256GB</h3>
        <div class="preco">R$ 6.399,00</div>
        <a href="https://wa.me/5527992985369" class="btn-comprar">Comprar Agora</a>
    </div>

</div>

<!-- MODAL DE GALERIA (FUNDO BRANCO) -->
<div id="modalGaleria" class="modal">
    <div class="modal-content-container">
        <span class="fechar" onclick="fecharGaleria()">&times;</span>
        <button class="nav-btn prev" onclick="mudarFoto(-1)">&#10094;</button>
        <img class="modal-content" id="imgSlide">
        <button class="nav-btn next" onclick="mudarFoto(1)">&#10095;</button>
        <div id="contadorFotos" class="contador"></div>
    </div>
</div>

<script>
    let fotosAtuais = [];
    let indiceAtual = 0;

    // Função para atualizar as bolinhas (dots) do card
    function atualizarDots(el) {
        const scrollEsquerda = el.scrollLeft;
        const larguraCard = el.offsetWidth;
        const indice = Math.round(scrollEsquerda / larguraCard);
        
        const dots = el.parentElement.querySelectorAll('.dot');
        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === indice);
        });
    }

    function abrirGaleria(lista, index) {
        fotosAtuais = lista;
        indiceAtual = index;
        document.getElementById("modalGaleria").style.display = "flex";
        atualizarSlide();
    }

    function fecharGaleria() {
        document.getElementById("modalGaleria").style.display = "none";
    }

    function mudarFoto(dir) {
        indiceAtual += dir;
        if (indiceAtual >= fotosAtuais.length) indiceAtual = 0;
        if (indiceAtual < 0) indiceAtual = fotosAtuais.length - 1;
        atualizarSlide();
    }

    function atualizarSlide() {
        const img = document.getElementById("imgSlide");
        img.src = fotosAtuais[indiceAtual];
        document.getElementById("contadorFotos").innerText = (indiceAtual + 1) + " / " + fotosAtuais.length;
    }

    // Fechar ao clicar fora da imagem
    window.onclick = function(e) {
        if (e.target.className === "modal") fecharGaleria();
    }
</script>

</body>
</html>
