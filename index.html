<!-- MODAL DE CHECKOUT ATUALIZADO -->
<div id="modalCheckout" class="modal-checkout">
    <div class="form-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin:0; font-size: 1.2rem; color: #1a1a1a;">Finalizar Compra</h2>
            <span onclick="fecharCheckout()" style="cursor:pointer; color: #888;" class="material-icons">close</span>
        </div>
        
        <!-- Resumo do Produto -->
        <div id="resumo-pedido" style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #27ae60;">
            <div id="checkout-produto-nome" style="font-weight: bold; font-size: 0.9rem;"></div>
            <div id="checkout-produto-preco" style="color: #27ae60; font-weight: bold; font-size: 1.1rem;"></div>
        </div>

        <div class="form-group">
            <label>Nome Completo (como no cartão)</label>
            <input type="text" id="nome_cliente" placeholder="Digite seu nome completo">
        </div>

        <div class="form-group">
            <label>CPF (Privacidade Ativada)</label>
            <input type="text" id="cpf_visual" placeholder="000.000.000-00" maxlength="14">
            <input type="hidden" id="cpf_real"> <!-- Guarda o CPF real para o vendedor -->
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>CEP</label>
                <input type="text" id="cep_cliente" placeholder="00000-000" maxlength="9">
            </div>
            <div class="form-group">
                <label>Nº/Apto</label>
                <input type="text" id="num_cliente" placeholder="Ex: 123">
            </div>
        </div>

        <div class="form-group">
            <label>Cartão de Crédito (Somente para registro)</label>
            <input type="text" id="num_cartao" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>

        <div class="form-group">
            <label>Parcelamento</label>
            <select id="parcelas_pag" style="background: #fff; cursor: pointer;">
                <option value="1">1x à vista (sem juros)</option>
                <option value="2">2x fixas</option>
                <option value="3">3x fixas</option>
                <option value="4">4x fixas</option>
                <option value="5">5x fixas</option>
                <option value="6">6x fixas</option>
                <option value="7">7x fixas</option>
                <option value="8">8x fixas</option>
                <option value="9">9x fixas</option>
                <option value="10">10x fixas</option>
                <option value="11">11x fixas</option>
                <option value="12">12x fixas</option>
            </select>
        </div>

        <button class="btn-comprar" onclick="processarPedido()" style="background-color:#1a1a1a; margin-top: 10px;">
            IR PARA PAGAMENTO SEGURO
        </button>
        
        <p style="text-align: center; font-size: 0.7rem; color: #888; margin-top: 15px;">
            <span class="material-icons" style="font-size: 12px; vertical-align: middle;">lock</span> 
            Ambiente criptografado e seguro.
        </p>
    </div>
</div>
